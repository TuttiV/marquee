name: Publish release

# Publishes the update zip that the in-app Update looks for.
#
# Two ways to start it:
#   - change the number in release-build.txt on main (for example to 26), or
#   - push a tag like v26.
# The release is named "Build N", the zip is attached as marquee-vN.zip, and the notes come from syncplay/CHANGELOG.md.
# The Linux downloads (marquee-linux-x86_64-vN.tar.xz and the package marquee_N_amd64.deb) and the Windows Setup
# (marquee-setup-vN.exe) are built and attached too; if one of those fails the zip still ships. A build number that
# already has a release is skipped, so re-running is harmless. The one exception: a release that is missing a Linux
# download gets it added (changing this file on main also starts a run, to fill that in).
on:
  push:
    branches:
      - main
    paths:
      - release-build.txt
      - .github/workflows/release.yml
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04  # Fixed: the package's dependency names are read from this system
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Work out the build number
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then build="${TAG#v}"; else build="$(tr -d '[:space:]' < release-build.txt)"; fi
          case "$build" in ''|*[!0-9]*) echo "Build number must be digits, got: $build"; exit 1;; esac
          if gh release view "v${build}" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            if grep -qx "marquee-linux-x86_64-v${build}.tar.xz" assets.txt && grep -qx "marquee_${build}_amd64.deb" assets.txt; then
              echo "Build ${build} already has a release; nothing to do."
              echo "SKIP=1" >> "$GITHUB_ENV"
            else
              echo "Build ${build} is released without a Linux download; adding it."
              echo "LINUX_ONLY=1" >> "$GITHUB_ENV"
            fi
          fi
          echo "BUILD=$build" >> "$GITHUB_ENV"

      - name: Build the update zip
        if: env.SKIP != '1' && env.LINUX_ONLY != '1'
        run: |
          python tools/make-release.py --build "$BUILD" --out dist
          mv "dist/Syncplay-Marquee-v${BUILD}.zip" "dist/marquee-v${BUILD}.zip"

      # The builder test-imports Qt, which needs the graphics libraries every Linux desktop has but this server lacks.
      # The package's dependencies are looked up from the libraries installed here, so they are all installed first.
      - name: Build the Linux downloads
        if: env.SKIP != '1'
        continue-on-error: ${{ env.LINUX_ONLY != '1' }}
        env:
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libfontconfig1 libfreetype6 libxkbcommon0 \
            libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libxcb-glx0 libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-xfixes0 libglib2.0-0t64 libgssapi-krb5-2 libbrotli1 libzstd1 zlib1g libcrypt1
          printf '{"updateRepo": "%s"}\n' "$REPO" > linux-defaults.json
          python tools/make-linux.py --build "$BUILD" --defaults linux-defaults.json --out dist

      # The same Setup as tools/make-setup.py makes by hand: NSIS for the wizard, mingw for its launcher, ImageMagick for
      # the artwork. Its Python and libraries are the Windows ones, downloaded by the builder.
      - name: Build the Windows Setup
        if: env.SKIP != '1' && env.LINUX_ONLY != '1'
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 imagemagick
          printf '{"updateRepo": "%s"}\n' "$REPO" > windows-defaults.json
          python tools/make-setup.py --build "$BUILD" --defaults windows-defaults.json --out dist-windows
          mv "dist-windows/Syncplay Marquee Setup.exe" "dist/marquee-setup-v${BUILD}.exe"

      - name: Write the release notes
        if: env.SKIP != '1' && env.LINUX_ONLY != '1'
        run: |
          python - <<'PY'
          import hashlib, os, sys
          sys.path.insert(0, ".")
          from syncplay import changelog
          build = int(os.environ["BUILD"])
          entry = next((e for e in changelog.load() if e[0] == build), None)
          lines = ["- " + b for b in entry[2]] if entry else ["Build %d" % build]
          def sha(path):
              return hashlib.sha256(open(path, "rb").read()).hexdigest()
          sums = ["sha256: " + sha("dist/marquee-v%d.zip" % build)]
          linux = "dist/marquee-linux-x86_64-v%d.tar.xz" % build
          if os.path.isfile(linux):
              sums.append("Linux sha256: " + sha(linux))
          deb = "dist/marquee_%d_amd64.deb" % build
          if os.path.isfile(deb):
              sums.append("Linux .deb sha256: " + sha(deb))
          setup = "dist/marquee-setup-v%d.exe" % build
          if os.path.isfile(setup):
              sums.append("Windows Setup sha256: " + sha(setup))
          open("notes.md", "w", encoding="utf-8").write("\n".join(lines) + "\n\n" + "\n".join(sums) + "\n")
          PY

      - name: Publish the release
        if: env.SKIP != '1' && env.LINUX_ONLY != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("dist/marquee-v${BUILD}.zip")
          for extra in "dist/marquee-setup-v${BUILD}.exe" "dist/marquee-linux-x86_64-v${BUILD}.tar.xz" "dist/marquee_${BUILD}_amd64.deb"; do
            if [ -f "$extra" ]; then assets+=("$extra"); fi
          done
          gh release create "v${BUILD}" "${assets[@]}" --title "Build ${BUILD}" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Add the missing Linux downloads to the existing release
        if: env.LINUX_ONLY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh release view "v${BUILD}" --json body --jq .body)"
          for linux in "dist/marquee-linux-x86_64-v${BUILD}.tar.xz" "dist/marquee_${BUILD}_amd64.deb"; do
            name="$(basename "$linux")"
            if grep -qx "$name" assets.txt; then continue; fi
            gh release upload "v${BUILD}" "$linux"
            case "$name" in *.deb) label="Linux .deb sha256";; *) label="Linux sha256";; esac
            body="$(printf '%s\n%s: %s' "$body" "$label" "$(sha256sum "$linux" | cut -d' ' -f1)")"
          done
          printf '%s\n' "$body" > notes.md
          gh release edit "v${BUILD}" --notes-file notes.md
